name: m82-semantic-port

on:
  push:
    branches:
      - feat/m8.2-product-answer-compaction

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8.2-product-answer-compaction
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply M8.2 semantic port
        run: python tooling/m82_port_patch.py

      - name: Verify targeted regressions
        run: |
          python -m pip install --quiet 'pytest>=8'
          node --check webapp/static/app.js
          python -m pytest -q \
            tests/test_m8_poi_product.py \
            tests/test_m6_weather.py \
            tests/test_m81_protected_area_app.py

      - name: Commit semantic port and remove temporary helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m82-port.yml tooling/m82_port_patch.py
          git add webapp/static/app.js webapp/static/index.html webapp/static/style.css tests/test_m8_poi_product.py
          git diff --cached --check
          git commit -m 'feat(m8.2): compact product answer on current main'
          git push origin HEAD:feat/m8.2-product-answer-compaction
